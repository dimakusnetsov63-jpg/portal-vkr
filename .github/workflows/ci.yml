name: CI

# H-12 (docs/AUDIT-2026-07-31.md). `verify` is the required gate; `dependency-audit`
# is informational only (continue-on-error) — a new advisory in an existing
# dependency isn't caused by whatever PR happens to run next, and failing an
# unrelated PR on it would just be noise. It runs at --audit-level=high so
# that a red mark means something new rather than a standing accepted
# exception; see docs/SECURITY.md for the registry and the reasoning.
#
# No secrets are configured or required: tsc/eslint/vitest/next build all
# succeed with zero environment variables (verified locally by running
# `npm run build` with .env.local removed entirely) — next.config.ts already
# falls back when NEXT_PUBLIC_SUPABASE_URL is unset, and the only code that
# reads SUPABASE_JWT_PRIVATE_JWK runs inside API route handlers at request
# time, never during the build.
#
# pull_request (not pull_request_target): this repo is public, and
# pull_request_target grants forked-PR workflow runs access to secrets and
# write permissions — a real supply-chain risk we don't need to take on,
# especially with no secrets to protect here regardless.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dependency-audit:
    name: dependency-audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # --audit-level=high sets the EXIT CODE threshold only: moderate and low
      # findings are still printed in full, they just don't turn the job red.
      # This matches the rule actually written in docs/SECURITY.md — "any high
      # or critical is either fixed or entered in the registry with a reason".
      #
      # Why the threshold at all: EX-003 (uuid inside exceljs) is an accepted
      # exception whose only npm-offered "fix" is a major downgrade of the
      # Excel parser. Left at the default, this job would be red permanently
      # for a finding that was already reviewed and consciously accepted — and
      # a permanently red mark is one people stop reading. Green here now means
      # "nothing above the documented threshold", so red means something new.
      #
      # NOT --omit=dev, deliberately. That flag judges a package by its section
      # in package.json, not by whether it ships: exceljs is a devDependency
      # but is imported from src/lib/imports/ and lands in the server bundle,
      # parsing user-uploaded files. The full tree is the honest scope here.
      # See docs/SECURITY.md, "Проверка зависимостей".
      #
      # continue-on-error stays: a new advisory in an existing dependency isn't
      # caused by whatever PR happens to run next, and failing an unrelated PR
      # on it would still be noise.
      - run: npm audit --audit-level=high

  rls-tests:
    name: rls-tests
    runs-on: ubuntu-latest
    # Docker (needed by `supabase start`) is present on ubuntu-latest by
    # default. Longer budget than `verify`: spinning up Postgres/PostgREST/
    # GoTrue containers and applying every migration is slower than the
    # plain typecheck/lint/test/build cycle.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # supabase/config.toml has [auth] enabled = false (H-16 — the portal
      # never uses Supabase Auth, and that setting is correct for the real
      # project). But locally this also stops the CLI from generating a
      # JWT secret and the anon/service_role tokens derived from it — the
      # second CI attempt confirmed `supabase status -o env` prints only
      # URLs with auth disabled, no keys, no JWT_SECRET at all, and the
      # supabase_auth container doesn't even start.
      #
      # This flips auth on only inside this job's disposable checkout,
      # purely so the local stack generates those tokens for the RLS
      # harness to sign test JWTs with — nothing here is committed, pushed,
      # or reaches the production project or its config.toml.
      # Scoped to the [auth] block only (through its first subsection,
      # [auth.rate_limit]) — config.toml has 13 other `enabled = false`
      # lines (db.pooler, storage.analytics, auth.external.apple,
      # auth.third_party.*, auth.oauth_server, ...) that must stay
      # untouched. Verified locally against the real file before use: only
      # [auth]'s own `enabled` flips, nothing else.
      - name: Temporarily enable auth for this ephemeral checkout only
        run: sed -i '/^\[auth\]$/,/^\[auth\./ s/^enabled = false$/enabled = true/' supabase/config.toml

      # Applies every migration under supabase/migrations/ to a fresh,
      # disposable local Postgres — never touches the production project.
      #
      # NOTE: there used to be a step here flipping `auto_expose_new_tables`
      # on, because the project's migrations contained no table-level GRANTs
      # and relied on Supabase Cloud's legacy auto-exposure instead. That
      # made these tests worse than useless: without grants PostgREST answers
      # 403/42501 — the same code RLS uses to reject a row — so "recruiter
      # can't write to another project" would have passed because of a
      # *missing grant*, not because a policy rejected it.
      #
      # SEC-3 (migration 20260813110000) made the grants explicit, so the
      # ephemeral database is now built from migrations alone. That is the
      # point: a green run here proves the grants are complete. The flag is
      # removed from the CLI on 2026-10-30 anyway — this job no longer cares.
      - run: npx supabase start

      # Maps supabase status's own key names onto RLS_TEST_* (src/testing/rls/env.ts)
      # so the test harness never has to know or guess the CLI's exact output
      # format — only this one step does. All values here are local-container
      # defaults with no relationship to the production project; none of them
      # are GitHub Actions secrets. See scripts/rls-env-from-supabase-status.mjs
      # for why this isn't a plain grep — the first attempt at this step
      # assumed ANON_KEY/SERVICE_ROLE_KEY names that this CLI version doesn't
      # use, and failed silently until the smoke test caught it.
      - name: Export local Supabase connection details
        run: npx supabase status -o env | node scripts/rls-env-from-supabase-status.mjs

      # SEC-3: proves the grants come from migrations, not from the platform.
      # Runs before the tests on purpose — a missing grant would otherwise
      # surface as a 403/42501 inside some scenario test, indistinguishable
      # from an RLS rejection and far harder to read than this check's
      # explicit "expected [...] / actual [...]" message.
      #
      # This also replaces the one-off `grant ... on portal_users to
      # service_role` that used to live here: migration 20260813110000 grants
      # it, so the fixtures' direct access to portal_users is now part of the
      # schema rather than a CI-only patch.
      - name: Verify grant model (SEC-3)
        run: npx supabase db query --local -f scripts/verify-grants.sql

      - run: npm run test:rls

      - if: always()
        run: npx supabase stop
