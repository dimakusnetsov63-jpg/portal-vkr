name: CI

# H-12 (docs/AUDIT-2026-07-31.md). `verify` is the required gate; `dependency-audit`
# is informational only (continue-on-error) — a new advisory in an existing
# dependency isn't caused by whatever PR happens to run next, and failing an
# unrelated PR on it would just be noise. See docs/SECURITY.md for the
# accepted-risk exception registry that `npm audit` output should be checked
# against by hand.
#
# No secrets are configured or required: tsc/eslint/vitest/next build all
# succeed with zero environment variables (verified locally by running
# `npm run build` with .env.local removed entirely) — next.config.ts already
# falls back when NEXT_PUBLIC_SUPABASE_URL is unset, and the only code that
# reads SUPABASE_JWT_PRIVATE_JWK runs inside API route handlers at request
# time, never during the build.
#
# pull_request (not pull_request_target): this repo is public, and
# pull_request_target grants forked-PR workflow runs access to secrets and
# write permissions — a real supply-chain risk we don't need to take on,
# especially with no secrets to protect here regardless.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dependency-audit:
    name: dependency-audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # Does not fail the job (continue-on-error above) — findings are
      # reviewed by hand against docs/SECURITY.md, not auto-suppressed here.
      - run: npm audit

  rls-tests:
    name: rls-tests
    runs-on: ubuntu-latest
    # Docker (needed by `supabase start`) is present on ubuntu-latest by
    # default. Longer budget than `verify`: spinning up Postgres/PostgREST/
    # GoTrue containers and applying every migration is slower than the
    # plain typecheck/lint/test/build cycle.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # supabase/config.toml has [auth] enabled = false (H-16 — the portal
      # never uses Supabase Auth, and that setting is correct for the real
      # project). But locally this also stops the CLI from generating a
      # JWT secret and the anon/service_role tokens derived from it — the
      # second CI attempt confirmed `supabase status -o env` prints only
      # URLs with auth disabled, no keys, no JWT_SECRET at all, and the
      # supabase_auth container doesn't even start.
      #
      # This flips auth on only inside this job's disposable checkout,
      # purely so the local stack generates those tokens for the RLS
      # harness to sign test JWTs with — nothing here is committed, pushed,
      # or reaches the production project or its config.toml.
      # Scoped to the [auth] block only (through its first subsection,
      # [auth.rate_limit]) — config.toml has 13 other `enabled = false`
      # lines (db.pooler, storage.analytics, auth.external.apple,
      # auth.third_party.*, auth.oauth_server, ...) that must stay
      # untouched. Verified locally against the real file before use: only
      # [auth]'s own `enabled` flips, nothing else.
      - name: Temporarily enable auth for this ephemeral checkout only
        run: sed -i '/^\[auth\]$/,/^\[auth\./ s/^enabled = false$/enabled = true/' supabase/config.toml

      # The project's migrations contain no table-level GRANTs at all — only
      # REVOKEs on the portal_* tables. Production works because Supabase
      # Cloud auto-exposed those tables to anon/authenticated/service_role
      # when they were created (the legacy behaviour). The local CLI defaults
      # to the *new* always-revoked behaviour, so without this the tables
      # exist but no Data API role can touch them — which would make these
      # tests worse than useless: "recruiter can't write to another project"
      # would pass with 42501 because of a *missing grant*, not because RLS
      # rejected it. Same error code, completely different reason.
      #
      # Turning this on reproduces production's actual grant state, letting
      # RLS be the only thing standing between a role and a row — which is
      # the entire point of these tests. The portal_auth migration then
      # revokes anon/authenticated from portal_* on top, exactly as in prod,
      # leaving service_role able to manage fixtures.
      #
      # NOTE: this flag is removed from the CLI on 2026-10-30. See
      # docs/ROLLOUT-rls-tests.md — the project needs explicit grants in
      # migrations before then regardless of these tests.
      - name: Reproduce production's table grants in this ephemeral checkout
        run: sed -i 's/^# auto_expose_new_tables = true$/auto_expose_new_tables = true/' supabase/config.toml

      # Applies every migration under supabase/migrations/ to a fresh,
      # disposable local Postgres — never touches the production project.
      - run: npx supabase start

      # Maps supabase status's own key names onto RLS_TEST_* (src/testing/rls/env.ts)
      # so the test harness never has to know or guess the CLI's exact output
      # format — only this one step does. All values here are local-container
      # defaults with no relationship to the production project; none of them
      # are GitHub Actions secrets. See scripts/rls-env-from-supabase-status.mjs
      # for why this isn't a plain grep — the first attempt at this step
      # assumed ANON_KEY/SERVICE_ROLE_KEY names that this CLI version doesn't
      # use, and failed silently until the smoke test caught it.
      - name: Export local Supabase connection details
        run: npx supabase status -o env | node scripts/rls-env-from-supabase-status.mjs

      # portal_users is the one table the migrations actively REVOKE
      # (20260728120000: `revoke all ... from anon, authenticated` — service_role
      # is untouched, so auto_expose above already covers it). Kept as an
      # explicit belt-and-braces grant anyway: fixtures must be able to seed
      # test users directly, since portal_admin_create_user needs an existing
      # head caller to authorise it — a chicken-and-egg problem for the very
      # first fixture in an empty database. Scoped to exactly what
      # src/testing/rls/client.ts does, on this ephemeral database only.
      #
      # (An earlier version of this comment claimed candidates/rate_cards/rates
      # needed no equivalent grant. That was wrong — they need grants too, but
      # via auto_expose_new_tables above, not one-off statements here.)
      - name: Grant service_role access to portal_users for fixtures only
        run: npx supabase db query --local "grant select, insert, delete on public.portal_users to service_role;"

      - run: npm run test:rls

      - if: always()
        run: npx supabase stop
